[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "crewai-autom"
version = "0.1.0"
description = "CrewAI tool for Autom: live Google, Google News, Bing, Brave, DuckDuckGo and Yahoo results."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Autom", email = "contact@autom.dev" },
]
keywords = ["crewai", "autom", "tools", "agents", "web-search"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "crewai>=0.150",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://www.autom.dev"
Documentation = "https://github.com/automdev/crewai-autom#readme"
Repository = "https://github.com/automdev/crewai-autom"
Issues = "https://github.com/automdev/crewai-autom/issues"

[tool.crewai]
type = "tool"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_autom"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
